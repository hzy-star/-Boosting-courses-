[settings]
; 登录页地址（保持默认即可，如机构不同可改 organization_id）
login_url = https://www.zaixian100f.com/home?organization_id=496419

; 播放倍速（运行前在这里改，例如 1 / 2 / 4 / 8 / 16）
speed = 1

; 同时并行的最大账号数（建议 3~5，太多会卡）。填 0 表示全部账号一起跑
max_parallel = 1

; 是否隐藏浏览器窗口：false=显示窗口  true=后台隐藏运行
headless = false

; 指定要刷的课程名称（留空则自动点第一个“继续学习”的课程）
course_name =

; 每个账号最长运行分钟数，超时自动关闭（0=不限制）
max_minutes = 0

; 使用哪个浏览器内核：msedge（Win 自带，推荐）/ chrome / 留空用下载的 chromium
browser_channel = msedge

; 登录最多提交几次（首次+重试）。该站连续失败超过 2 次会被限制登录，建议不超过 2
login_attempts = 2

; faceCompare 拦截：true=优先把“当前真实抓拍帧”转发给服务器做真比对（清晰正脸才会真通过、
; 后台才会真记学时）；只有服务器拒绝时才伪造成功放行（保证视频不被卡住，但那一次不计学时）。
bypass_face = true

; 摄像头模式：
;   file   = 用 Y4M 文件直接当假摄像头（画质最干净、人脸比对最稳，推荐）
;            每账号读 faces/<身份证号>.y4m，找不到回退 face.y4m；每账号开独立浏览器
;   inject = 用注入脚本+画布接管摄像头（支持按提示精准转头，但画质经压缩，比对易不过）
;            每账号读 faces/<身份证号>/front|turnA|turnB.mp4
camera_mode = inject
